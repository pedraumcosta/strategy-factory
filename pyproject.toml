[project]
name = "strategy-factory"
version = "0.1.0"
description = "Agent pipeline that researches, implements, validates, deploys (dry-run) and observes freqtrade strategies, with human gates between stages"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "pandas>=3.0.6",
    "papermill>=2.7.0",
    "pyarrow>=25.0.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "golden: runs a real backtest through the lab docker image (needs docker + price data)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factory"]
